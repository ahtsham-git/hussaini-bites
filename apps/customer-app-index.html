@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.scr{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;animation:fade .3s var(--out)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px var(--pad) 124px;-webkit-overflow-scrolling:touch}

/* ---------- base controls ---------- */

.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}.btn.soft{background:var(--acs);color:var(--ac)}.btn.red{background:var(--r);color:#fff}.btn.ghost{background:var(--card);color:var(--t);border:1px solid var(--line)}.narrow{max-width:260px}

.in:focus{border-color:var(--ac)}.in::placeholder{color:var(--m)}
.err{color:var(--r);font-size:13px;margin:-2px 0 10px 4px}

.brand{font-weight:800;font-size:19px;color:var(--ac);letter-spacing:-.3px}.brand.xl{font-size:32px;margin-top:6px}
.tag{color:var(--m);font-size:13px;font-style:italic}.desc{color:var(--m);line-height:1.6;margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.3);backdrop-filter:blur(var(--bl)) saturate(1.3);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px;cursor:pointer;transition:transform .15s}

.grow{flex:1;min-width:0}.grow h4{font-size:16px;font-weight:600}.grow p{font-size:13px;color:var(--m);margin:2px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:15px}

.note.soft{background:var(--card);color:var(--m);font-weight:500;font-size:13px;border:1px solid var(--line)}

.tl{border-inline-start:2px solid var(--line);margin:6px 12px 6px;padding-inline-start:20px}.tl div{position:relative;padding:6px 0 14px;color:var(--m)}

.tl small{color:var(--m);font-weight:400;font-size:13px}

/* ---------- tab bar + cart bar ---------- */
.nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.4);backdrop-filter:blur(var(--bl)) saturate(1.4);border:1px solid var(--line);box-shadow:var(--sh);z-index:6}

.dlv{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}.dlv small{font-size:11px;color:var(--m)}.dlv b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.srow{display:flex;gap:10px;align-items:flex-start}.srow .in{flex:1;margin-bottom:0}
.fbtn{width:52px;height:52px;flex:none;border:0;border-radius:50%;background:var(--t);color:var(--bg);display:grid;place-items:center;cursor:pointer}

.deal:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(12,10,7,.95),rgba(12,10,7,.7) 44%,rgba(12,10,7,0) 80%)}

.phero>img{width:100%;height:100%;object-fit:cover}.phero>svg{width:100%;height:100%;padding:40px}
.phero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to bottom,transparent,var(--bg))}
.phero .ic{position:absolute;top:calc(env(safe-area-inset-top) + 12px);z-index:2;background:var(--glass)}.phero .bk{inset-inline-start:var(--pad)}.phero .shr{inset-inline-end:var(--pad)}
.pbody{flex:1;overflow-y:auto;padding:4px var(--pad) 16px;position:relative;z-index:1}
.pbody h1{font-size:28px;letter-spacing:-.6px;line-height:1.2}
.meta{display:flex;align-items:center;gap:12px;color:var(--m);font-size:14px;margin:6px 0 12px}
.lbl{font-size:13px;font-weight:600;color:var(--m);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.szg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.szc{min-height:64px;border-radius:var(--r2);border:2px solid var(--line);background:var(--card);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px;transition:border-color .2s,background .2s}.szc b{font-size:15px}.szc span{font-size:13px;color:var(--m)}.szc.on{border-color:var(--ac);background:var(--acs)}.szc.on span{color:var(--ac)}
.pbuy{flex:none;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;padding:12px var(--pad) calc(env(safe-area-inset-bottom) + 14px);background:var(--glass);-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));border-top:1px solid var(--line);position:relative;z-index:3}
.pbuy .pp small{display:block;font-size:12px;color:var(--m)}.pbuy .pp b{font-size:22px;letter-spacing:-.4px}
.pbuy .btn{grid-row:1/3;grid-column:2;min-height:60px;border-radius:30px;padding:0 8px 0 22px;justify-content:space-between}
.pbuy .btn i{width:44px;height:44px;border-radius:50%;background:var(--onac);color:var(--ac);display:grid;place-items:center;flex:none}
.cartbar{flex:none;padding:12px var(--pad);background:var(--glass);-webkit-backdrop-filter:blur(var(--bl));backdrop-filter:blur(var(--bl));border-top:1px solid var(--line);margin-bottom:86px}
/* ---------- notifications, guide, lists ---------- */
.nrow{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.nic{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex:none}
.nrow small{color:var(--m);font-size:12px;display:block;margin-top:3px}.new{width:8px;height:8px;border-radius:50%;background:var(--r);flex:none;margin-top:6px}
.lang,.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.lang button,.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:none;color:var(--m);font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,color .2s}
.lang button.on,.seg button.on{background:var(--ac);color:var(--onac)}
.step{display:flex;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;align-items:flex-start}
.step i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-style:normal}
.step h4{font-size:16px;margin-bottom:2px}.step p{color:var(--m);font-size:14px;line-height:1.6}
.legal p{color:var(--t);line-height:1.7;margin-bottom:12px;font-size:15px}.legal p.hd{font-weight:700;margin-bottom:4px}
/* ---------- side bar ---------- */
.dr{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .3s var(--out)}.dr.on{opacity:1;pointer-events:auto}
.dp2{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(82%,320px);padding:calc(env(safe-area-inset-top) + 16px) 16px 20px;overflow-y:auto;background:var(--glass);background:color-mix(in srgb,var(--bg) 42%,transparent);-webkit-backdrop-filter:blur(calc(var(--bl) + 10px)) saturate(1.5);backdrop-filter:blur(calc(var(--bl) + 10px)) saturate(1.5);border-inline-end:1px solid var(--line);transform:translateX(-102%);transition:transform .38s var(--out)}
[dir=rtl] .dp2{transform:translateX(102%)}.dr.on .dp2{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center}.dp2 .brand{margin:10px 0 0}.who{margin:10px 0 0;font-weight:700}.dl{margin-top:14px}.adr{color:var(--m);font-size:12px;margin-top:14px}
.dp2 .m{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;margin:4px 0;padding:0 14px;border-radius:14px;border:0;background:var(--card);background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--t);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;text-align:start}.dp2 .m:active{background:var(--acs)}
/* ---------- welcome + login ---------- */
.pic{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.35))}
.corner{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) var(--pad)}
.wp{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:90px 24px calc(env(safe-area-inset-bottom) + 22px);background:linear-gradient(to top,var(--wt),transparent);-webkit-backdrop-filter:blur(calc(var(--bl) + 8px));backdrop-filter:blur(calc(var(--bl) + 8px));-webkit-mask-image:linear-gradient(to top,#000 62%,transparent);mask-image:linear-gradient(to top,#000 62%,transparent)}
.wp h1{font-size:34px;letter-spacing:-1px;line-height:1.15;margin-bottom:8px}.wp p{color:var(--t);opacity:.78;margin-bottom:20px;font-size:16px;line-height:1.6}
.auth{overflow-y:auto;overflow-x:hidden}
.ahero{position:absolute;top:0;left:0;right:0;height:40vh;z-index:0;background-size:cover;background-position:center}
.ahero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 35%)}
.asheet{position:relative;isolation:isolate;margin-top:28vh;flex:1 0 auto;padding:124px var(--pad) calc(env(safe-area-inset-bottom) + 20px)}
.asheet:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,transparent,var(--glass) 130px);background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 88%,transparent) 130px);-webkit-backdrop-filter:blur(calc(var(--bl) + 8px));backdrop-filter:blur(calc(var(--bl) + 8px));-webkit-mask-image:linear-gradient(to bottom,transparent,#000 120px);mask-image:linear-gradient(to bottom,transparent,#000 120px)}
.asheet:after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(60% 40% at 80% 20%,var(--g1),transparent 70%),radial-gradient(60% 40% at 10% 60%,var(--g2),transparent 70%)}
.asheet h1{font-size:28px;letter-spacing:-.7px;line-height:1.2}.asheet .sub{color:var(--m);margin:4px 0 18px;line-height:1.6}
.or{display:flex;align-items:center;gap:10px;color:var(--m);font-size:13px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.demo{flex-direction:column;gap:2px;margin-top:10px}.demo small{font-size:12px;font-weight:500;opacity:.8}
.terms{color:var(--m);font-size:12.5px;line-height:1.8;text-align:center;margin-top:16px}.terms button{display:inline-block;border:0;background:none;color:var(--t);font-weight:700;font-size:inherit;text-decoration:underline;cursor:pointer;padding:16px 6px;margin:-16px -2px;min-width:44px;font-family:inherit;vertical-align:baseline}
.wp .terms{margin-top:12px;margin-bottom:0}
.sl{display:block;text-align:end;font-size:11px;color:var(--m);margin-top:18px;font-style:italic}
@media (max-width:340px){.grid{grid-template-columns:minmax(0,1fr)}.deal h2{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function calc(items,menu,deals,cfg,type,address){let sub=0;const out=[];
 for(const it of items){let name,price;
  if(it.deal){const d=deals.find(x=>x.id===it.id);if(!d)throw Error('This deal is no longer available');name=d.title.replace('|',' ');price=d.price}
  else{const m=menu.find(x=>x.id===it.id),z=m&&m.sizes.find(s=>s.name===it.size);if(!m||!z||m.isAvailable===false)throw Error('An item in your cart is no longer available');name=m.name+(m.sizes.length>1?' ('+z.name+')':'');price=z.price}
  sub+=price*it.qty;out.push({id:it.id,name,size:it.size,price,qty:it.qty,deal:!!it.deal})}
 let fee=0;if(type==='delivery'){const z=cfg.delivery.zones,k=Object.keys(z).find(v=>(address||'').toLowerCase().includes(v.toLowerCase()));fee=k?z[k]:cfg.delivery.default}
 return{items:out,subtotal:sub,deliveryFee:fee,total:sub+fee}}

function supaApi(){
 const{url,anonKey}=CONFIG.supabase;
 const ready=import('./vendor/supabase-js.esm.js').catch(()=>import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm')).then(m=>m.createClient(url,anonKey,{auth:{persistSession:true,autoRefreshToken:true}}));
 const NET=e=>!navigator.onLine||/fetch|network|failed to|timeout|load failed/i.test(String(e&&e.message||e));
 const OB='hb_outbox_orders';
 const obLoad=()=>{try{const a=JSON.parse(localStorage.getItem(OB)||'[]');return Array.isArray(a)?a:[]}catch{return[]}};
 const obSave=a=>{try{localStorage.setItem(OB,JSON.stringify(a.slice(-20)))}catch{}};
 /* orders placed while offline are sent once the connection returns; the same ref is never saved twice */
 const obFlush=async()=>{const q=obLoad();if(!q.length)return;const c=await ready.catch(()=>null);if(!c)return;const keep=[];for(const j of q){const{error}=await c.rpc('place_order',j.args);if(error&&NET(error))keep.push(j)}obSave(keep)};
 window.addEventListener('online',()=>obFlush());
 const em=p=>p.replace(/\D/g,'')+'@users.hussainibites.app';
 /* ONE shared snapshot (get_catalog) + ONE realtime channel for config, menu, categories and deals. Updates are batched, so
    a dashboard save that touches 30 rows causes one refetch per phone, not 30. */
 const bus={v:{},s:{config:new Set(),menu:new Set(),deals:new Set()},tm:0,go:0,tries:0};
 const SNAP=s=>{s=s||{};const cm=Object.fromEntries((s.categories||[]).map(x=>[x.id,x])),now=Date.now();
  return{config:s.config||{},
   menu:(s.items||[]).filter(i=>cm[i.category_id]).map(i=>({id:i.id,name:i.name,nameUr:i.name_ur,description:i.description,descriptionUr:i.description_ur,cat:cm[i.category_id].name,catUr:cm[i.category_id].name_ur,co:cm[i.category_id].sort_order,imageUrl:i.photo_url,rating:i.rating||4.8,discount:i.discount||0,isAvailable:i.is_available,pop:i.is_popular,sizes:i.sizes})).sort((x,y)=>x.co-y.co),
   deals:(s.deals||[]).filter(d=>(!d.starts_at||Date.parse(d.starts_at)<=now)&&(!d.ends_at||Date.parse(d.ends_at)>=now)).map(d=>({id:d.id,title:d.title,titleUr:d.title_ur,description:d.description,descriptionUr:d.description_ur,price:d.price,note:d.note,noteUr:d.note_ur,tag:d.tag,tagUr:d.tag_ur,discount:d.discount||0,imageUrl:d.photo_url,isActive:true}))}};
 try{const c0=JSON.parse(localStorage.getItem('hb_catalog')||'null');if(c0)bus.v=SNAP(c0)}catch{}
 const pull=async c=>{try{const{data,error}=await c.rpc('get_catalog');if(error)throw error;try{localStorage.setItem('hb_catalog',JSON.stringify(data))}catch{}bus.v=SNAP(data);bus.tries=0;for(const k in bus.s)bus.s[k].forEach(f=>f(bus.v[k]))}catch(e){if(bus.tries++<4)setTimeout(()=>pull(c),2000*bus.tries)}};

 const ord=r=>({id:String(r.id),customerId:r.customer_id,customer:r.customer,type:r.type,items:r.items,subtotal:r.subtotal,deliveryFee:r.delivery_fee,total:r.total,status:r.status,createdAt:r.created_at,statusHistory:(r.status_history||[]).map(h=>({status:h.status,at:h.at}))});
 const prof=async(c,u)=>{if(!u)return null;if(u.is_anonymous)return{uid:u.id,name:'Guest',guest:true,addresses:[]};const{data}=await c.from('customers').select('name,phone,addresses').eq('id',u.id).maybeSingle();return{uid:u.id,name:data?.name||'Customer',phone:data?.phone,addresses:data?.addresses||[],guest:false}};

  watchOrders:(uid,cb)=>sub(async c=>{let ch=null;
   const run=async()=>{const{data}=await c.from('orders').select('*').eq('customer_id',uid).order('created_at',{ascending:false}).limit(100),rows=(data||[]).map(ord);cb(rows);
    const live=rows.some(o=>!FINAL.includes(o.status));if(live&&!ch){ch=c.channel('o'+uid.slice(0,8)+Math.random().toString(36).slice(2,6)).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'customer_id=eq.'+uid},run);ch.subscribe()}if(!live&&ch){c.removeChannel(ch);ch=null}};
   refreshOrders=run;run();const vis=()=>document.visibilityState==='visible'&&run();document.addEventListener('visibilitychange',vis);
   return()=>{document.removeEventListener('visibilitychange',vis);ch&&c.removeChannel(ch)}}),
  onAuth:cb=>sub(async c=>{c.auth.getSession().then(async({data})=>cb(await prof(c,data.session?.user)));const{data}=c.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')cb(null)});return()=>data.subscription.unsubscribe()}),
  register:async(name,phone,pw)=>{const c=await ready,{data,error}=await c.auth.signUp({email:em(phone),password:pw});if(error)throw bad(error);if(!data.session)throw Error('Sign-up needs email confirmation turned off in Supabase Auth settings');
   await c.from('customers').upsert({id:data.user.id,name,phone,addresses:[]});return{uid:data.user.id,name,phone,addresses:[],guest:false}},
  login:async(phone,pw)=>{const c=await ready,{data,error}=await c.auth.signInWithPassword({email:em(phone),password:pw});if(error)throw bad(error);return prof(c,data.user)},
  guest:async()=>{const c=await ready,{data,error}=await c.auth.signInAnonymously();if(error)throw Error('Guest mode is turned off in Supabase Auth settings');return prof(c,data.user)},
  saveProfile:async(uid,d)=>{const c=await ready;await c.from('customers').upsert({id:uid,...d})},
  logout:async()=>{const c=await ready;await c.auth.signOut()},
  placeOrder:async o=>{const args={p_items:o.items.map(i=>({id:i.id,size:i.size,qty:i.qty,deal:!!i.deal})),p_type:o.type,p_address:o.address,p_payment:'cod',p_note:o.note,p_name:o.name,p_phone:o.phone,p_ref:o.ref||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2))};try{const c=await ready,{data,error}=await c.rpc('place_order',args);if(error)throw rpcErr(error);obFlush();refreshOrders();return String(data)}catch(e){if(!NET(e))throw e;obSave([...obLoad(),{args,at:Date.now()}]);return 'queued'}},
  cancelOrder:async id=>{const c=await ready,{error}=await c.rpc('cancel_order',{p_id:Number(id)});if(error)throw rpcErr(error);refreshOrders()},
  completeOrder:async id=>{const c=await ready,{error}=await c.rpc('complete_order',{p_id:Number(id)});if(error)throw rpcErr(error);refreshOrders()}}}
