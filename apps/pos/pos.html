<style>
:root{--bg:#e8eee0;--card:#ffffff;--card2:#e3ead9;--ink:#1a2014;--mute:#5e6b52;--y:#b9e63a;--ac:#3d6b0a;--r:#e8481c;--g:#2f7d32;--line:#cdd8bf;--hb:#fff;--sh:#0003;--sa:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.bar.on{display:flex}.bar b{font-size:18px}.bar div{flex:1;font-weight:700}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:12px;background:var(--r);color:#fff;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.96)}.btn.y{background:var(--y);color:#111}.btn.d{background:#111;color:var(--y)}.btn.g{background:var(--card2);color:var(--ink)}.btn.sm{min-height:44px;min-width:44px;padding:0 12px}.btn.w{width:100%}

label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{flex:none}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,160px));gap:8px;justify-content:start}
.it{min-height:78px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .1s,border-color .2s}
.it:active{transform:scale(.97);border-color:var(--ac)}.it b{font-size:15px}.it span{color:var(--ac);font-weight:800;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px;color:var(--ac)}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}.line:last-child{border:0}
.line .n{flex:1;min-width:0}.line .n b{display:block}.line .n small{color:var(--mute)}
.q{display:flex;align-items:center;gap:4px}.q button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);font-size:22px;font-weight:800}.q b{min-width:26px;text-align:center}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font-size:22px;font-weight:900;color:var(--ac);border-top:2px solid var(--y);margin-top:6px;padding-top:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:700}.seg button.on{background:var(--y);color:#111}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.sheet{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:flex-end}.sheet.on{display:flex}

.sheet h2{margin:0 0 8px;font-size:18px}
.vb{display:flex;justify-content:space-between;width:100%;min-height:52px;margin:6px 0;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--card2);font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);background:var(--y);color:#111;padding:10px 16px;border-radius:20px;font-weight:800;z-index:70;animation:in .2s}
.burger{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;cursor:pointer}
.burger i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ink)}
.dr{position:fixed;inset:0;z-index:30;background:#0006;display:none}.dr.on{display:block}
.dp{position:absolute;left:0;top:0;bottom:0;width:min(86vw,340px);background:var(--bg);overflow:auto;padding:calc(14px + var(--st)) 14px calc(20px + var(--sa));border-right:3px solid var(--y);animation:sl .22s ease}
@keyframes sl{from{transform:translateX(-30px);opacity:.3}to{transform:none;opacity:1}}
.dp h4{margin:16px 0 6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.dp .m{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;margin:4px 0;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;text-align:left;cursor:pointer}
.lgb{flex:none;border:0;background:none;padding:0;cursor:pointer;line-height:0}.lgb img{height:48px;width:auto;display:block}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:8px 0}.ck input{width:22px;height:22px;min-height:0;flex:none}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,160px));gap:8px;justify-content:start}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.kp small{display:block;color:var(--mute);font-size:12px}.kp b{font-size:17px;color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}.bars i{flex:1;min-width:5px;background:var(--y);border-radius:4px 4px 0 0}
.bl{display:flex;gap:3px;font-size:10px;color:var(--mute)}.bl span{flex:1;min-width:5px;text-align:center;overflow:hidden}
.pb{height:6px;border-radius:4px;background:var(--y);margin-top:4px}
.nb{display:block}
@media(min-width:900px){.nb{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
 .pr{position:sticky;top:calc(76px + var(--st));max-height:calc(100vh - 150px);overflow:auto}.pr .card:first-child{margin-top:0}
 .tabs{flex-wrap:wrap}main{padding:16px 20px calc(150px + var(--sa))}}
@media(min-width:700px){.sheet{align-items:center;justify-content:center}.sheet>div{max-width:520px;border-radius:22px;max-height:88vh}}
#v-his,#v-stk{max-width:1000px;margin:0 auto}#v-adm{max-width:640px;margin:0 auto}.kp b{white-space:nowrap;font-size:clamp(11.5px,3.7vw,18px)}.xw{overflow-x:auto}.xt{width:100%;border-collapse:collapse;font-size:14px}.xt th{text-align:left;font-size:12px;color:var(--mute);padding:6px;border-bottom:2px solid var(--y);white-space:nowrap}.xt td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top}.xt .r{text-align:right;white-space:nowrap;font-weight:800}.xt tr[data-e]{cursor:pointer}.xt tr[data-e]:active{background:var(--card2)}.xt tfoot td{font-weight:900;border-top:2px solid var(--y);border-bottom:0;color:var(--ac)}@media(max-width:599px){.xt{font-size:13px}.xt td{padding:8px 4px}}
/* receipt */
#paper{--fs:13px;--zm:1;background:#fff;color:#000;margin:0 auto;padding:10px;font:calc(var(--fs)*var(--zm))/1.35 "Courier New",monospace;width:100%;max-width:302px;overflow-wrap:anywhere}
#paper.p58{--fs:11px;max-width:210px}#paper.a4{--fs:15px;max-width:560px}
#paper .c{text-align:center}#paper hr{border:0;border-top:1px dashed #000;margin:6px 0}
#paper .l{display:flex;justify-content:space-between;gap:6px}#paper .l span:first-child{flex:1}#paper .l span:last-child{white-space:nowrap}
#paper .gt{font-weight:900;font-size:1.25em}
#paper .qr{display:block;margin:4px auto 2px;width:42%;max-width:150px;height:auto}
#print-area{display:none}
.rep{font:12px/1.4 Arial,sans-serif;color:#000;background:#fff}.rep h1{font-size:20px;margin:0}.rep h3{margin:14px 0 2px}.rep table{width:100%;border-collapse:collapse;margin:6px 0}.rep th,.rep td{border:1px solid #999;padding:4px 6px;text-align:left}.rep th{background:#eee}.rep .r{text-align:right}
@media print{
 body>*:not(#print-area){display:none!important}
 #print-area{display:block}
 html,body{background:#fff;overflow:visible;height:auto}
 #print-area #paper{width:100%;max-width:none;padding:3vw;font-size:calc(4.4vw*var(--zm))}
}
@media print and (min-width:480px){
 #print-area #paper{max-width:302px;padding:8px;font-size:calc(13px*var(--zm))}

 #print-area #paper.a4{max-width:560px;font-size:calc(15px*var(--zm))}}
.it small{font-size:11px}
@media(max-width:599px){
 html,body{font-size:14px}
 header{padding:calc(6px + var(--st)) 10px 6px;gap:8px}header b{font-size:15px}header small{font-size:11px;margin-top:2px}header .no{font-size:13px}.lgb img{height:38px}
 main{padding:8px 8px calc(130px + var(--sa))}
 .items{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

 .tab{min-height:36px;padding:0 12px;font-size:13px}.tabs{padding:8px 0}
 nav button{min-height:50px;font-size:11px}nav button span{font-size:18px}
 .card{padding:10px;margin:10px 0}.card h3{font-size:14px}
 input,select,textarea{min-height:40px;padding:8px 10px;font-size:14px}label{font-size:12px;margin:8px 0 3px}
 .btn{min-height:42px;font-size:14px;padding:0 12px}.btn.sm{min-height:40px;min-width:40px}
 .q button{width:38px;height:38px;font-size:20px}.line .n b{font-size:14px}
 .kp{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.kp div{padding:8px}.kp b{font-size:14px}.kp small{font-size:10.5px}
 .bar{bottom:calc(56px + var(--sa))}.bar b{font-size:16px}.dp .m{min-height:46px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lg{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto;padding:20px}.lg.on{display:flex}.lg>.card{width:min(420px,100%);margin:auto;text-align:center}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none;pointer-events:none}nav button .i{width:24px;height:24px;vertical-align:0}.dp .m .i{width:1.3em;height:1.3em}.tab .i{vertical-align:-.18em}@media(max-width:599px){nav button .i{width:22px;height:22px}}/* ===== GLASSMORPHISM THEME ===== */
:root{color-scheme:light;--gl:color-mix(in srgb,var(--card) 64%,transparent);--gl2:color-mix(in srgb,var(--card) 44%,transparent);--gl3:color-mix(in srgb,var(--card) 82%,transparent);--gb:rgba(255,255,255,.85);--gi:inset 0 1px 0 rgba(255,255,255,.9);--gs:0 14px 34px -16px rgba(45,70,20,.35);--fx:blur(22px) saturate(1.5);--spr:cubic-bezier(.34,1.5,.64,1);--out:cubic-bezier(.22,1,.36,1);--sheen:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,0) 55%);--on:#10140b;--glow:color-mix(in srgb,var(--y) 55%,transparent);--lime:linear-gradient(160deg,color-mix(in srgb,var(--y) 100%,#fff 20%),var(--y));--aur:radial-gradient(55% 45% at 10% 6%,rgba(190,235,60,.42),transparent 62%),radial-gradient(50% 42% at 95% 14%,rgba(255,170,120,.40),transparent 62%),radial-gradient(60% 50% at 80% 96%,rgba(150,200,255,.34),transparent 64%),radial-gradient(45% 40% at 4% 88%,rgba(120,210,160,.32),transparent 62%)}
[data-theme=dark]{color-scheme:dark;--gl:color-mix(in srgb,var(--card) 56%,transparent);--gl2:color-mix(in srgb,var(--card) 36%,transparent);--gl3:color-mix(in srgb,var(--card) 80%,transparent);--gb:rgba(255,255,255,.11);--gi:inset 0 1px 0 rgba(255,255,255,.10);--gs:0 16px 40px -16px rgba(0,0,0,.85);--aur:radial-gradient(60% 38% at 55% 48%,rgba(130,160,50,.20),transparent 70%),radial-gradient(55% 45% at 10% 6%,rgba(200,242,58,.30),transparent 62%),radial-gradient(50% 42% at 96% 16%,rgba(255,123,87,.26),transparent 62%),radial-gradient(65% 55% at 78% 98%,rgba(150,105,60,.52),transparent 64%),radial-gradient(45% 40% at 2% 86%,rgba(70,140,70,.40),transparent 62%)}
html{background:var(--bg)}
body{background:transparent;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-18%;z-index:-1;background:var(--aur);pointer-events:none;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translate3d(-2%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.12)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{transform:scaleY(0);opacity:.2}to{transform:none;opacity:1}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes barin{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(60px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes sl{from{transform:translateX(-44px);opacity:0}to{transform:none;opacity:1}}

@keyframes tout{to{opacity:0;transform:translate(-50%,-10px) scale(.95)}}
.view.on{animation:none}
.view.stg .card,.view.stg .kp div,.view.stg .tabs,.view.stg .xw,.view.stg .pl>input,.view.stg .btn.w,.view.stg .it,.view.stgi .it{animation:rise .75s var(--out) both;animation-delay:calc(var(--d,0)*55ms)}
/* header */
header{top:calc(8px + var(--st));margin:calc(8px + var(--st)) 10px 0;padding:8px 12px;gap:10px;border:1px solid var(--gb);border-radius:24px;background:var(--sheen),var(--gl);box-shadow:var(--gi),var(--gs);-webkit-backdrop-filter:var(--fx);backdrop-filter:var(--fx)}
header b{font:800 18px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
main{padding-top:14px}
/* floating nav + sliding pill */
nav{left:0;right:0;margin:0 auto;bottom:calc(10px + var(--sa));width:min(540px,calc(100% - 20px));padding:6px;gap:2px;border:1px solid var(--gb);border-radius:30px;background:var(--sheen),var(--gl);box-shadow:var(--gi),var(--gs);-webkit-backdrop-filter:var(--fx);backdrop-filter:var(--fx)}

.seg button.on{background:var(--lime);color:var(--on)}
.seg[data-si] button.on{background:none}
.kp div{border:1px solid var(--gb);border-radius:18px;background:var(--sheen),var(--gl);box-shadow:var(--gi),var(--gs);-webkit-backdrop-filter:var(--fx);backdrop-filter:var(--fx)}
.kp b{font-weight:800}
.pill{background:var(--gl2);border:1px solid var(--gb)}
.vb{border:1px solid var(--gb);border-radius:18px;background:var(--gl2);box-shadow:var(--gi);transition:transform .35s var(--spr),border-color .25s}
.vb:active{transform:scale(.97);border-color:var(--y)}
.burger{border:1px solid var(--gb);border-radius:16px;background:var(--gl2);box-shadow:var(--gi);transition:transform .35s var(--spr)}
.burger:active{transform:scale(.9)}
/* charts */
.bars{gap:5px;height:120px}
.bars i{border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--y),color-mix(in srgb,var(--y) 30%,transparent));box-shadow:0 0 18px -6px var(--glow);transform-origin:bottom;animation:grow .9s var(--out) both;animation-delay:calc(var(--n,0)*22ms)}
.pb{height:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--y) 35%,transparent),var(--y));transform-origin:left;animation:growx .9s var(--out) both}
/* tables */
.xt th{border-bottom:1px solid var(--gb)}
.xt td{border-bottom:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.xt tfoot td{border-top:1px solid var(--gb)}
.xt tr[data-e]{transition:background .2s}.xt tr[data-e]:active{background:var(--gl2)}
/* sheets, drawer, toast, login */
.sheet,.dr{background:rgba(6,8,4,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.on,.dr.on{animation:fade .3s var(--out)}
.sheet>div{border:1px solid var(--gb);border-bottom:0;border-radius:30px 30px 0 0;background:var(--gl3);box-shadow:var(--gi),0 -20px 50px -20px #0009;-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);animation:up .55s var(--spr)}
@media(min-width:700px){.sheet>div{border-radius:30px;border-bottom:1px solid var(--gb)}}
.dp{border:0;border-right:1px solid var(--gb);border-radius:0 30px 30px 0;background:var(--gl3);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);animation:sl .55s var(--spr)}
.dp .m{border:1px solid var(--gb);border-radius:16px;background:var(--gl2);box-shadow:var(--gi);transition:transform .35s var(--spr),border-color .25s}
.dp .m:active{transform:scale(.97);border-color:var(--y)}
.toast{top:calc(84px + var(--st));background:var(--lime);color:var(--on);border-radius:22px;padding:11px 18px;box-shadow:0 12px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);animation:tin .5s var(--spr) both,tout .3s ease 1.4s forwards}
.lg{background:var(--aur),var(--bg)}
.lg>.card{-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6)}
@media(min-width:900px){.pr{top:calc(96px + var(--st))}}
@media(max-width:599px){
 header{padding:7px 10px}header b{font-size:15px}
 main{padding:8px 8px calc(156px + var(--sa))}
 .bar{bottom:calc(86px + var(--sa))}
 .card{padding:12px;border-radius:22px}
 .it{border-radius:16px}
 .bars{height:100px}
}
@media print{body::before{display:none!important}html,body{background:#fff!important}}
/* --- smoothness pass --- */
body::before{animation:none;will-change:auto}
@keyframes rise{from{opacity:0;transform:translate3d(var(--dx,0px),16px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise2{from{opacity:0;transform:translate3d(0,10px,0) scale(.985)}to{opacity:1;transform:none}}
.view.stg .card,.view.stg .kp div,.view.stg .tabs,.view.stg .xw,.view.stg .pl>input,.view.stg .btn.w,.view.stg .it,.view.stgi .it{animation:rise .55s var(--out) both;animation-delay:calc(var(--d,0)*40ms);will-change:transform,opacity;-webkit-backdrop-filter:none;backdrop-filter:none}
.view.stgs .card,.view.stgs .kp div,.view.stgs .xw,.view.stgs .it{animation:rise2 .42s var(--out) both;animation-delay:calc(var(--d,0)*30ms);-webkit-backdrop-filter:none;backdrop-filter:none}
/* sliding pill for sub-tabs */
.tabs{position:relative}
.tabs .ti{position:absolute;left:0;top:0;width:0;height:0;border-radius:22px;background:var(--lime);box-shadow:0 8px 18px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .5s var(--spr),width .4s var(--out),height .3s var(--out);z-index:0;pointer-events:none}
.tabs .ti.nt{transition:none}
.tabs .tab{position:relative;z-index:1}
.tabs[data-ti] .tab.on{background:none!important;box-shadow:none;border-color:transparent}
@keyframes blob{0%{scale:1 1}28%{scale:1.02 .86}62%{scale:.99 1.06}100%{scale:1 1}}
.ni.blob,.si.blob,.ti.blob{animation:blob .7s var(--out)}
/* press feel */
button{transition:transform .4s var(--spr),background .25s,color .25s}
.prs{transform:scale(.93)!important;transition-duration:.12s!important}
tr[data-e].prs{transform:none!important;background:var(--gl2)}

/* ===== Hussaini Bites visual refinement: food tiles, login, motion, responsive stats ===== */
.food-tile,.deal-tile{position:relative;min-height:148px!important;overflow:hidden;align-items:stretch!important;justify-content:flex-end!important;gap:5px;padding:12px!important;border-radius:22px!important;background:linear-gradient(145deg,var(--sheen),var(--gl2))!important;-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35)}
.food-visual{height:62px;display:grid;place-items:center;font-size:48px;line-height:1;filter:drop-shadow(0 8px 8px #0002);margin:2px 0 4px}
.food-tile>b,.deal-tile>b{font-size:14px!important;line-height:1.2}
.tile-price{display:block!important;color:var(--ac)!important;font-size:14px!important;font-weight:900!important}
.tile-sub{display:block;color:var(--mute);font-size:10px;font-weight:600;margin-top:2px}
.tile-badge{position:absolute;top:9px;left:9px;z-index:2;padding:4px 8px;border-radius:20px;font-size:9px;line-height:1;font-weight:900;letter-spacing:.45px}
.offer-badge{background:linear-gradient(135deg,#d8a900,#f4d65e);color:#211900;box-shadow:0 4px 12px #b58b2638}
.deal-badge{background:linear-gradient(135deg,#d8a900,#f4d65e);color:#211900;box-shadow:0 4px 12px #b58b2638}
.deal-visuals{display:flex;align-items:center;justify-content:center;gap:5px;min-height:65px;overflow:hidden;padding:4px 0}
.deal-visual{position:relative;display:grid;place-items:center;min-width:43px;height:48px;border-radius:15px;background:var(--gl3);border:1px solid var(--gb);box-shadow:var(--gi),0 5px 12px #0001}
.deal-visual i{font-style:normal;font-size:25px;line-height:1}
.deal-visual small{position:absolute;right:-3px;top:-5px;border-radius:10px;padding:2px 5px;background:var(--ac);color:white;font-size:9px;font-weight:900}
.deal-tile{border-color:color-mix(in srgb,var(--y) 65%,var(--gb))!important}
@media(max-width:599px){
 .food-tile,.deal-tile{min-height:132px!important;padding:9px!important;border-radius:18px!important}
 .food-visual{height:48px;font-size:39px}

 .tile-price{font-size:11px!important}
}
/* Stronger frosted sidebar; retain translucency over the live screen. */
.dp{background:color-mix(in srgb,var(--bg) 64%,transparent)!important;-webkit-backdrop-filter:blur(46px) saturate(1.75)!important;backdrop-filter:blur(46px) saturate(1.75)!important;box-shadow:18px 0 55px #0002,inset -1px 0 0 var(--gb)}
.dr{background:rgba(4,6,3,.42)!important;-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2)}
/* ===== v3 · Login: photo backdrop, progressive blur (bottom ~40%), glass PIN panel ===== */
.lg{padding:0!important;overflow:hidden;background:#090b08!important}
.login-scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;color:#fff;isolation:isolate;padding:calc(18px + var(--st)) 18px calc(16px + var(--sa))}
.lg-photo{position:absolute;inset:-3%;z-index:-3;background:var(--kitchen) 94% 50%/cover no-repeat;animation:lgken 26s ease-in-out infinite alternate;will-change:transform}
@keyframes lgken{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.5%,-1%,0)}}
.lg-tint{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(6,8,4,.62) 0%,rgba(6,8,4,.12) 30%,rgba(6,8,4,0) 55%,rgba(6,8,4,.38) 100%)}
.lg-blur{position:absolute;left:0;right:0;bottom:0;z-index:-1;pointer-events:none}
.lg-blur.b1{height:42%;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(to top,#000 0,#000 40%,transparent 100%);mask-image:linear-gradient(to top,#000 0,#000 40%,transparent 100%)}
.lg-blur.b2{height:35%;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);-webkit-mask-image:linear-gradient(to top,#000 0,#000 45%,transparent 100%);mask-image:linear-gradient(to top,#000 0,#000 45%,transparent 100%)}
.lg-blur.b3{height:28%;-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);background:linear-gradient(to top,rgba(6,8,4,.5),transparent);-webkit-mask-image:linear-gradient(to top,#000 0,#000 50%,transparent 100%);mask-image:linear-gradient(to top,#000 0,#000 50%,transparent 100%)}
.lg-brand{display:flex;align-items:center;gap:12px;align-self:flex-start;width:100%;max-width:1100px;margin:0 auto;animation:lgin .7s var(--out) both}
.lg-brand img{width:52px;height:52px;object-fit:contain;border-radius:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);padding:3px;filter:drop-shadow(0 6px 14px #0007)}

.lg-cluster .c1{transform:translate(-62%,6%) rotate(-9deg);animation-delay:0s,.12s}

@keyframes lgfloat{from{translate:0 -6px}to{translate:0 8px}}

@keyframes lgup{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.login-panel.shake{animation:lgshake .46s cubic-bezier(.36,.07,.19,.97)}

.login-welcome{text-align:center;font-size:clamp(22px,4.4vw,28px);font-weight:850;letter-spacing:-.02em}

.login-pin-wrap:focus-within{border-color:var(--y);box-shadow:0 0 0 4px color-mix(in srgb,var(--y) 24%,transparent)}

.login-pin-wrap .eye{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:14px;background:transparent;color:#e8eedf;cursor:pointer}
.login-pin-wrap .eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-pin-wrap .eye.on{color:var(--y)}
.login-panel .btn{width:100%;min-height:52px;font-size:16px;border-radius:18px;background:var(--lime);color:#10140b}
.login-foot{text-align:center;color:#d4d9cc;font-size:11.5px;margin-top:14px;opacity:.75}

/* ===== v3 · Stat tiles: fluid grid, numbers always fit ===== */
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;justify-content:stretch}
.kp div{min-width:0;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:74px;-webkit-backdrop-filter:none;backdrop-filter:none}

.kp b{display:block;max-width:100%;white-space:nowrap;overflow:hidden;font-size:clamp(15px,1.5vw,20px);line-height:1.2;font-variant-numeric:tabular-nums}

.food-tile,.deal-tile{position:relative;height:174px!important;min-height:174px!important;padding:0 10px 12px!important;display:flex!important;align-items:stretch!important;justify-content:flex-end!important;gap:3px!important;overflow:hidden!important;border-radius:23px!important;border:1px solid #ffffffa8!important;background:linear-gradient(145deg,var(--gl3),var(--gl2))!important;box-shadow:var(--gi),0 10px 24px #0002!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.food-photo{position:absolute;inset:0 0 35px;width:100%;height:calc(100% - 35px);object-fit:cover;z-index:0}.food-shade{position:absolute;inset:35% 0 0;z-index:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.86))}.food-tile>b,.deal-tile>b,.food-tile .tile-price,.deal-tile .tile-price{position:relative;z-index:1;color:#fff!important;text-shadow:0 1px 4px #000;font-size:13px!important}.food-tile:after,.deal-tile:after{content:"";position:absolute;right:0;bottom:0;width:82px;height:76px;z-index:2;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(145deg,#456b26,#244515)}.tile-arrow{position:absolute;right:8px;bottom:8px;z-index:3;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#e1dcae,#c7c18b);color:#17200f;font-size:20px;font-weight:1000;box-shadow:0 3px 10px #0005}[data-theme=dark] .food-tile:after,[data-theme=dark] .deal-tile:after{background:linear-gradient(145deg,#f2d735,#b89a08)}[data-theme=dark] .tile-arrow{background:linear-gradient(145deg,#fff16a,#d4ad00);color:#211900}.food-tile .tile-price{padding-right:34px}.deal-visuals{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:88px;overflow:hidden}.deal-visual{position:relative;width:clamp(38px,30%,66px);height:72px;border-radius:13px;overflow:hidden;border:1px solid #ffffff8c}.deal-visual img{width:100%;height:100%;object-fit:cover}.deal-visual small{position:absolute;right:2px;top:2px;background:#d5b51b;color:#171400;border-radius:9px;padding:2px 5px;font-size:9px;font-weight:900}.tile-badge{z-index:4}
/* ===== v3 · Graphs ===== */
.gpair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
@media(min-width:760px){.gpair:not(.solo){grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcell{min-width:0;padding:12px 12px 10px;border-radius:20px;border:1px solid var(--gb);background:var(--gl2);box-shadow:var(--gi)}
.graph-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.graph-head .gtt{min-width:0;flex:1 1 140px}.graph-head .gtt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.graph-head .gtt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.35}
.graph-head .gact{display:flex;align-items:center;gap:8px;flex:none}
.graph-pick{width:auto;min-width:104px;min-height:38px;padding:4px 26px 4px 10px;font-size:12px;border-radius:12px;flex:none}
.gwrap{position:relative;margin-top:12px;touch-action:pan-y;cursor:crosshair;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.ggrid{stroke:var(--ink);stroke-opacity:.11;stroke-width:1;stroke-dasharray:3 7}
.gline{fill:none;stroke:var(--y);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:gdraw 1.1s var(--out) .05s forwards;filter:drop-shadow(0 0 6px var(--glow))}
.garea{opacity:0;animation:gfade .9s ease .3s forwards}
.gdot{fill:var(--bg);stroke:var(--y);stroke-width:2.6;transform-box:fill-box;transform-origin:center;animation:gpop .5s var(--spr) both;animation-delay:calc(.45s + var(--n,0)*26ms)}
.gdot.pk{fill:var(--y);stroke:#fff;stroke-width:2}
.gbar{transform-box:fill-box;transform-origin:50% 100%;animation:gbar .8s var(--out) both;animation-delay:calc(var(--n,0)*22ms)}
.gbar.pk{filter:drop-shadow(0 0 8px var(--glow))}
@keyframes gdraw{to{stroke-dashoffset:0}}@keyframes gfade{to{opacity:1}}@keyframes gpop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}@keyframes gbar{from{transform:scaleY(0)}to{transform:none}}
.gguide{position:absolute;top:0;bottom:0;left:var(--gx,0);width:1.5px;background:linear-gradient(var(--y),transparent);opacity:0;transition:opacity .2s;pointer-events:none}
.gdotv{position:absolute;left:var(--gx,0);top:var(--gy,0);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--y);box-shadow:0 0 0 4px color-mix(in srgb,var(--y) 28%,transparent),0 0 16px var(--glow);opacity:0;transition:opacity .2s;pointer-events:none}
.gtip{position:absolute;left:var(--gx,0);top:var(--gy,0);transform:translate(-50%,calc(-100% - 14px));padding:6px 10px;border-radius:12px;font-size:12px;font-weight:800;line-height:1.2;white-space:nowrap;color:var(--ink);background:var(--gl3);border:1px solid var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
.gtip[data-s=l]{transform:translate(-14%,calc(-100% - 14px))}.gtip[data-s=r]{transform:translate(-86%,calc(-100% - 14px))}
.gtip[data-v=b]{transform:translate(-50%,16px)}.gtip[data-v=b][data-s=l]{transform:translate(-14%,16px)}.gtip[data-v=b][data-s=r]{transform:translate(-86%,16px)}
.gwrap.act .gguide,.gwrap.act .gdotv,.gwrap.act .gtip{opacity:1}
.chart-labels{position:relative;height:18px;margin-top:6px;color:var(--mute);font-size:11px;line-height:18px}
.chart-labels span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.gempty{display:grid;place-items:center;min-height:120px;color:var(--mute);font-size:13px;text-align:center}
.daily-expense-card{border-color:color-mix(in srgb,var(--y) 40%,var(--gb))}
@media(max-width:599px){.food-tile,.deal-tile{height:152px!important;min-height:152px!important;border-radius:19px!important;padding:0 7px 9px!important}.tile-arrow{width:25px;height:25px;font-size:17px;right:6px;bottom:6px}.food-tile>b,.deal-tile>b,.food-tile .tile-price,.deal-tile .tile-price{font-size:11px!important}.deal-visual{height:56px}}
/* ===== v3 · Design-system polish, responsiveness, performance ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;overflow-wrap:break-word}
img,svg,video{max-width:100%}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.btn{min-height:44px}.btn.sm{min-height:40px}
.tab{min-height:40px}
/* heavy blurs only where they matter: cheap, smooth scrolling on phones */
.it,.food-tile,.deal-tile,.btn.g,.pill,.q button{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
@media(min-width:600px){.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;justify-content:stretch}}
@media(min-width:760px){#v-adm{max-width:760px}}
@media(min-width:900px){nav{width:60%;max-width:1100px;padding:8px;border-radius:34px}nav button{min-height:68px;font-size:16px;gap:4px}nav button .i{width:28px;height:28px}nav .ni{top:8px;bottom:8px;border-radius:28px}nav button{border-radius:28px}.bar{width:min(60%,1100px)}}
@media(min-width:1280px){
 header{max-width:1240px;width:calc(100% - 20px);margin-left:auto;margin-right:auto}
 main{max-width:1280px;margin-left:auto;margin-right:auto}
 #v-his,#v-stk{max-width:1160px}
}
@media(max-height:500px) and (orientation:landscape){nav button{min-height:44px}.bar{bottom:calc(66px + var(--sa))}}
@media(hover:none){.it:hover,.btn:hover{transform:none;filter:none}}

/* ===== v4 · pictures, groups, paired cards ===== */
.fpw{position:absolute;inset:0;overflow:hidden;z-index:0;border-radius:inherit}
.food-tile .fpw{inset:0 0 35px}
.fp{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}
.fp-bg{filter:blur(14px) saturate(1.25) brightness(.72);transform:scale(1.35)}
.fit-contain .fp:not(.fp-bg){background-size:contain;transform:scale(.94)}
.deal-visual .fpw{inset:0;border-radius:inherit}
.subtabs{margin-top:-4px}
.subtabs .tab{min-height:34px;font-size:13px;padding:0 13px;opacity:.95}
.cpair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.cpair>.card{margin:0;min-width:0}
@media(min-width:760px){.cpair{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.phrow{display:flex;gap:14px;align-items:flex-start;margin:6px 0 4px}
.phprev{position:relative;flex:none;width:112px;height:150px;border-radius:18px;overflow:hidden;border:1px solid var(--gb);background:var(--gl2);box-shadow:var(--gi)}
.phprev .fpw{inset:0}
.phact{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.phact small{color:var(--mute);font-size:12px;line-height:1.35}
.btn.g.danger{color:var(--r);border-color:color-mix(in srgb,var(--r) 55%,transparent)}
.btn.danger:not(.g){background:linear-gradient(160deg,#ff8a6b,#e8481c);color:#fff;box-shadow:0 8px 20px -8px rgba(232,72,28,.6)}

/* ===== v6 readability and reliability fixes (CSS only) ===== */
/* Top bar and bottom menu: solid enough that menu text, bars and tiles never show through their labels */
header,nav{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,0) 55%),var(--hb)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* Menu tiles: badge text must stay dark on the yellow badge in both themes (generic .it span rule was turning it accent-coloured) */
.it .tile-badge{color:#211900}
/* Menu tiles: "4 sizes" line is light text on the dark photo shade in both themes */
.food-tile .tile-sub,.deal-tile .tile-sub{color:#f3f6ec;opacity:.92}
.food-tile .tile-arrow,.deal-tile .tile-arrow{color:#17200f}
/* Phones: keep prices and badges on one line (no "From Rs" / "399" split) */
.tile-badge{white-space:nowrap}
@media(max-width:599px){.food-tile .tile-price,.deal-tile .tile-price{white-space:nowrap;padding-right:0!important}.food-tile:after,.deal-tile:after{width:58px;height:54px}}
/* Older browsers without color-mix(): use solid colours instead of transparent glass so text stays visible */
@supports not (background:color-mix(in srgb,red 50%,blue)){
 :root{--gl:var(--card);--gl2:var(--card2);--gl3:var(--card);--glow:var(--y);--lime:var(--y)}
 [data-theme=dark]{--gl:var(--card);--gl2:var(--card2);--gl3:var(--card);--glow:var(--y);--lime:var(--y)}
}

   if(ex>-1){if(!confirm('"'+C[ex]+'" already exists. Merge "'+old+'" into it?'))return;S.exp.forEach(x=>{if(x.cat===old)x.cat=C[ex]});C.splice(i,1)}else{S.exp.forEach(x=>{if(x.cat===old)x.cat=nn});C[i]=nn}
   return ok()}
  if(k==="dl"){const dest=C.find((c,j)=>j!==i);if(!dest)return toast("Keep at least one category");const n=S.exp.filter(x=>x.cat===old).length;if(!confirm('Delete "'+old+'"?'+(n?"\n"+n+' entries will move to "'+dest+'".':"")))return;S.exp.forEach(x=>{if(x.cat===old)x.cat=dest});C.splice(i,1);return ok()}
  if(k==="add"){const nn=$("cmnew").value.trim();if(!nn)return toast("Enter a name");if(C.some(c=>c.toLowerCase()===nn.toLowerCase()))return toast("Already exists");C.push(nn);return ok()}
  if(k==="clr"){if(!S.exp.length)return toast("No entries");if(!confirm("Delete ALL "+S.exp.length+" stock & expense entries? This cannot be undone.")||!confirm("Really delete every entry?"))return;S.exp.forEach(x=>imgDel(x.id));S.exp=[];save();closeSheet();renderStk();toast("All entries deleted")}}}
/* events */
($("v-stk")||{}).onclick=e=>{if(role!=="admin")return;const tr=e.target.closest("tr[data-e]");if(tr)return expForm(tr.dataset.e);const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.p){XF.per=d.p;XF.n=100;if(d.p==="custom"&&!XF.from)XF.from=XF.to=dstr(new Date());return renderStk()}
 if(d.a==="add")return expForm();if(d.a==="dailyadd")return expForm(null,{d:dstr(new Date()),cat:"Daily Expenses",n:"",amt:"",qty:"",note:""});if(d.a==="cats")return catMgr();if(d.a==="more"){XF.n+=100;return renderXR()}
 if(d.a==="csv")return xCsv();if(d.a==="pdf")return xPdf();
 if(d.a==="clrdata")return clearDataForm();if(d.a==="bkx")return xBackup(true);if(d.a==="bkxd")return xBackup(false);};
($("v-stk")||{}).oninput=e=>{if(e.target.id==="xq"){XF.q=e.target.value;XF.n=100;renderXR()}};
($("v-stk")||{}).onchange=e=>{const t=e.target;if(t.id==="xcat"){XF.cat=t.value;XF.n=100;renderXR()}else if(t.id==="xf"||t.id==="xt"){XF[t.id==="xf"?"from":"to"]=t.value;XF.n=100;renderXR()}
 else if(t.id==="xim"){const f=t.files[0];t.value="";xImport(f)}};
load();if(!S.set.cpin){S.set.cpin="1111";save()}applyTheme();brand();renderMenu();resetForm();
{let sr=null;try{sr=sessionStorage.getItem(K+"_r")}catch(e){}sr==="admin"||sr==="cashier"?setRole(sr):lockApp()}
</script>
<script>
/* ===== Glass motion layer: sliding pills, staggered entrances, count-up numbers ===== */
(()=>{
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const hist={};
const tabPrev={};
function tkey(t){const v=t.closest(".view");return (v?v.id:"x")+":"+$$(".tabs",v||document).indexOf(t)}
function apply(ind,l,w){ind.style.width=w+"px";ind.style.transform="translateX("+l+"px)"}
function place(box,cls){
 const on=box.querySelector(":scope>button.on"),ind=box.querySelector(":scope>."+cls);
 if(!on||!ind||!on.offsetWidth)return;
 const l=on.offsetLeft,w=on.offsetWidth;
 if(cls==="ti"){ind.style.top=on.offsetTop+"px";ind.style.height=on.offsetHeight+"px";tabPrev[tkey(box)]={l,w,t:on.offsetTop,h:on.offsetHeight}}
 const fresh=ind.classList.contains("nt");
 if(fresh||ind._l===undefined||rm){
  clearTimeout(ind._tm);ind.style.transition="none";apply(ind,l,w);ind._l=l;ind._w=w;
  if(fresh){ind.getBoundingClientRect();requestAnimationFrame(()=>{ind.classList.remove("nt");ind.style.transition=""})}
  return;
 }
 if(l===ind._l&&w===ind._w)return;
 /* Direct glide: keep the pill contained and move it smoothly to the selected tab. */
 clearTimeout(ind._tm);
 ind.style.transition="transform .38s cubic-bezier(.22,1,.36,1),width .30s cubic-bezier(.22,1,.36,1)";
 apply(ind,l,w);
 ind.classList.remove("blob");
 ind._l=l;ind._w=w;
}
function mk(box,cls){
 if(!box.querySelector(":scope>."+cls)){const i=document.createElement("i");i.className=cls+" nt";box.prepend(i)}
}
function layout(){
 const n=document.querySelector("nav");
 if(n){mk(n,"ni");place(n,"ni")}
 $$(".seg").forEach(s=>{mk(s,"si");s.dataset.si=1;place(s,"si")});
 $$(".tabs").forEach(t=>{
  if(!t.querySelector(":scope>.ti")){
   const i=document.createElement("i"),pv=tabPrev[tkey(t)];
   i.className="ti"+(pv?"":" nt");t.prepend(i);t.dataset.ti=1;
   if(pv){i.style.width=pv.w+"px";i.style.top=pv.t+"px";i.style.height=pv.h+"px";i.style.transform="translateX("+pv.l+"px)";i._l=pv.l;i._w=pv.w;i.getBoundingClientRect()}
  }
  place(t,"ti");
 });
}
function fmt(m,v){return m[2].includes(",")?v.toLocaleString("en-IN"):String(v)}
function cu(el){
 el.dataset.cu=1;
 if(rm)return;
 const t=el.textContent,m=t.match(/^(\D*?)(\d[\d,]*)(\D*)$/);
 if(!m)return;
 const to=+m[2].replace(/,/g,"");
 let key;
 if(el.closest("#bt"))key="bt";
 else if(el.closest(".tot"))key="tot";
 else{const v=el.closest(".view");key=(v?v.id:"x")+":"+$$(".kp b",v||document).indexOf(el)}
 const from=hist[key]??0;hist[key]=to;
 if(from===to)return;
 const t0=performance.now(),dur=Math.min(1000,500+Math.abs(to-from)/50);
 const f=now=>{
  const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,4);
  el.textContent=p<1?m[1]+fmt(m,Math.round(from+(to-from)*e))+m[3]:t;if(p>=1)fitKp();
  if(p<1&&el.isConnected)requestAnimationFrame(f);
 };
 requestAnimationFrame(f);
}
function enhance(){
 $$(".bars:not([data-n])").forEach(b=>{b.dataset.n=1;[...b.children].forEach((e,i)=>e.style.setProperty("--n",i))});
 $$(".kp b:not([data-cu]),#bt b:not([data-cu]),.tot .g span:last-child:not([data-cu])").forEach(cu);
}
function fitKp(){
 $$(".view.on .kp b").forEach(b=>{
  b.style.fontSize="";if(b.scrollWidth<=b.clientWidth+0.5)return;
  let fs=parseFloat(getComputedStyle(b).fontSize);
  while(b.scrollWidth>b.clientWidth+0.5&&fs>9){fs-=.5;b.style.fontSize=fs+"px"}
 });
}
let q=0;
function sched(){if(q)return;q=requestAnimationFrame(()=>{q=0;layout();enhance();fitKp()})}
function enter(v,cls){
 if(rm||!v)return;
 clearTimeout(v._t);v.classList.remove("stg","stgi","stgs");
 let g=0,k=0;
 $$(".card,.kp div,.tabs,.xw,.pl>input,.btn.w,.items>.it",v).forEach(e=>{
  if(e.classList.contains("it"))e.style.setProperty("--d",Math.min(k++,12)*.4);
  else e.style.setProperty("--d",Math.min(g++,14));
 });
 void v.offsetWidth;v.classList.add(cls||"stg");
 v._t=setTimeout(()=>v.classList.remove("stg","stgi","stgs"),1500);
}
const navs=[...document.querySelectorAll("nav button")];let cur=0;
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
 const id="v-"+b.dataset.v;
 const ni=navs.indexOf(b),vv=document.getElementById(id);
 if(vv)vv.style.setProperty("--dx",(ni>cur?26:ni<cur?-26:0)+"px");cur=ni;
 Object.keys(hist).forEach(k=>{if(k.startsWith(id+":"))delete hist[k]});
 enter(document.getElementById(id));
 sched();
}));
document.addEventListener("click",e=>{
 if(!e.target.closest("#tabs .tab,#subs .tab"))return;
 requestAnimationFrame(()=>{
  const v=document.getElementById("v-new");if(!v||rm)return;
  v.style.setProperty("--dx","0px");
  clearTimeout(v._t);v.classList.remove("stg","stgi","stgs");
  $$("#items .it",v).forEach((e,i)=>e.style.setProperty("--d",Math.min(i,12)*.4));
  void v.offsetWidth;v.classList.add("stgi");
  v._t=setTimeout(()=>v.classList.remove("stgi"),1200);
 });
});
function enterSub(v){
 if(rm||!v||v.id==="v-new")return;
 clearTimeout(v._t);v.classList.remove("stg","stgi","stgs");
 let g=0;
 $$(".card,.kp div,.xw",v).forEach(e=>e.style.setProperty("--d",Math.min(g++,10)));
 void v.offsetWidth;v.classList.add("stgs");
 v._t=setTimeout(()=>v.classList.remove("stgs"),1100);
}
document.addEventListener("click",e=>{
 const t=e.target.closest&&e.target.closest(".tab,.seg button");
 if(!t||t.closest("nav,#sh,.dr"))return;
 const v=t.closest(".view");if(!v)return;
 requestAnimationFrame(()=>enterSub(v));
});
document.addEventListener("change",e=>{
 const t=e.target,v=t.closest&&t.closest("#v-his,#v-stk");
 if(v&&t.matches("select,input[type=date]"))requestAnimationFrame(()=>enterSub(v));
});
/* press-down feel */
const PS="button,.it,.tab,.btn,.vb,.burger,.dp .m,tr[data-e],.ck,.lgb";
addEventListener("pointerdown",e=>{
 const t=e.target.closest&&e.target.closest(PS);
 if(!t||t.disabled)return;
 t.classList.add("prs");const t0=performance.now();
 const end=()=>{
  setTimeout(()=>t.classList.remove("prs"),Math.max(0,140-(performance.now()-t0)));
  ["pointerup","pointercancel","pointerleave"].forEach(x=>t.removeEventListener(x,end));
 };
 ["pointerup","pointercancel","pointerleave"].forEach(x=>t.addEventListener(x,end));
},{passive:true,capture:true});

/* ---- chart tooltip: hover on desktop, drag on touch ---- */
(()=>{
 let hideT;
 const show=(w,cx)=>{
  const j=w._j||(w._j=JSON.parse(w.dataset.g)),r=w.getBoundingClientRect(),n=j.t.length;
  let i=Math.floor((cx-r.left)/r.width*n);i=Math.max(0,Math.min(n-1,i));
  const px=j.x[i]*100,py=j.y[i]*100,tip=w.querySelector(".gtip");
  w.style.setProperty("--gx",px.toFixed(2)+"%");w.style.setProperty("--gy",py.toFixed(2)+"%");
  tip.textContent=j.t[i];tip.dataset.s=px<20?"l":px>80?"r":"c";tip.dataset.v=py<30?"b":"t";
  w.classList.add("act");clearTimeout(hideT)};
 const hide=w=>{clearTimeout(hideT);hideT=setTimeout(()=>w.classList.remove("act"),w._touch?1400:0)};
 document.addEventListener("pointerdown",e=>{const w=e.target.closest&&e.target.closest(".gwrap");if(!w)return;w._touch=e.pointerType!=="mouse";show(w,e.clientX)},{passive:true});
 document.addEventListener("pointermove",e=>{const w=e.target.closest&&e.target.closest(".gwrap");if(!w)return;if(e.pointerType==="mouse"||e.buttons||w.classList.contains("act"))show(w,e.clientX)},{passive:true});
 document.addEventListener("pointerup",e=>{const w=e.target.closest&&e.target.closest(".gwrap");if(w)hide(w)},{passive:true});
 document.addEventListener("pointerout",e=>{const w=e.target.closest&&e.target.closest(".gwrap");if(w&&e.pointerType==="mouse"&&!w.contains(e.relatedTarget))hide(w)},{passive:true});
})();
new MutationObserver(r=>{
 if(r.some(x=>!(x.target.closest&&x.target.closest("[data-cu]"))))sched();
}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});
addEventListener("resize",sched);
addEventListener("load",sched);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
sched();
})();
</script>
