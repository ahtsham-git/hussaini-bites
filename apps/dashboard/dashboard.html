<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f4">
<title>Hussaini Bites — Owner Control Centre</title>
<style>
:root{--bg:#f1f2ef;--panel:#fff;--panel2:#f7f8f6;--text:#191b19;--muted:#777d77;--line:#e8ebe6;--accent:#f0a15b;--accent2:#e76f3c;--soft:#fff1e4;--green:#279b68;--greenSoft:#e8f5ee;--red:#d95b58;--blue:#4b82bd;--shadow:0 8px 28px rgba(29,38,30,.055);--radius:19px}
[data-theme="dark"]{--bg:#151715;--panel:#202320;--panel2:#282c28;--text:#f2f4f0;--muted:#a4aaa2;--line:#353b35;--accent:#f0a15b;--accent2:#e76f3c;--soft:#3c2c20;--green:#63c795;--greenSoft:#20392d;--red:#f07872;--blue:#79a9e1;--shadow:0 9px 28px rgba(0,0,0,.22)}
[data-theme="light"]{--accent:#279b68;--accent2:#168455;--soft:#e8f5ee}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.app{max-width:1600px;margin:auto;padding:20px;min-height:100vh}.shell{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:calc(100vh - 40px);position:sticky;top:20px;height:calc(100vh - 40px)}
.logo{width:40px;height:40px;border-radius:14px;object-fit:cover;margin:2px 0 15px;background:#fff}.railbtn{width:42px;height:42px;border-radius:14px;background:transparent;color:var(--muted);font-size:18px;display:grid;place-items:center;transition:.2s}.railbtn:hover,.railbtn.active{background:var(--soft);color:var(--accent2);transform:translateY(-1px)}.railspacer{flex:1}
.main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:10px;min-width:150px}.brandline img{width:34px;height:34px;object-fit:contain;border-radius:50%}.brandline strong{font-size:14px;letter-spacing:-.3px}.brandline small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.nav{display:flex;gap:4px;align-items:center;overflow:auto;scrollbar-width:none;max-width:70%}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 13px;border-radius:30px;background:transparent;color:var(--muted);font-size:12px;transition:.2s}.nav button.active{background:var(--text);color:var(--panel)}.topactions{display:flex;align-items:center;gap:8px}.iconbtn{height:36px;min-width:36px;border-radius:50%;background:var(--panel2);color:var(--muted);display:grid;place-items:center;position:relative}.iconbtn:hover{color:var(--accent2)}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:7px 2px 16px}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:5px}.pagehead h1{font-size:25px;letter-spacing:-1px;margin:0;font-weight:650}.pagehead p{font-size:12px;color:var(--muted);margin:6px 0 0}.headtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 14px;background:var(--text);color:var(--panel);font-size:12px;font-weight:600;transition:transform .18s,opacity .18s}.btn:hover{transform:translateY(-1px);opacity:.9}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.accent{background:var(--accent2);color:#fff}.btn.soft{background:var(--soft);color:var(--accent2)}.btn.small{padding:7px 10px;font-size:11px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);min-width:0;animation:rise .32s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.kpihead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.kpiicon{width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--accent2);display:grid;place-items:center}.value{font-size:27px;font-weight:680;letter-spacing:-1px;margin:12px 0 5px}.trend{font-size:10px;color:var(--green)}.muted{color:var(--muted)}.smalltext{font-size:11px;color:var(--muted)}
.mainrow{grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);margin-bottom:14px}.cardtitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cardtitle h3{margin:0;font-size:14px;font-weight:650}.cardtitle p{margin:4px 0 0;color:var(--muted);font-size:10px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.select,input.search{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 10px;font-size:11px;min-width:0}.chartwrap{height:230px;position:relative}.chartwrap canvas{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-top:6px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--accent2)}.dot.blue{background:var(--blue)}
.branchlist{display:grid;gap:13px}.branchrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.branchmeta{display:flex;align-items:center;gap:10px}.branchmark{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;color:var(--accent2)}.branchmeta strong{font-size:12px;display:block}.branchmeta small{font-size:10px;color:var(--muted)}.branchamount{text-align:right;font-size:13px;font-weight:650}.progress{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:8px}.progress span{height:100%;display:block;background:var(--accent2);border-radius:9px}
.lower{grid-template-columns:minmax(0,1.35fr) minmax(250px,.85fr)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}th{text-align:left;color:var(--muted);font-weight:500;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;font-size:10px;background:var(--greenSoft);color:var(--green)}.status.pending{background:var(--soft);color:var(--accent2)}.status.transit{background:#eaf1fb;color:var(--blue)}[data-theme="dark"] .status.transit{background:#25364b}.status.cancel{background:#fbeceb;color:var(--red)}.stocklist{display:grid;gap:13px}.stockitem{display:flex;align-items:center;gap:10px}.foodthumb{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:19px}.stockitem strong{font-size:11px;display:block}.stockitem small{font-size:10px;color:var(--muted)}
.pagegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{padding:15px}.tile h4{font-size:12px;margin:0 0 7px}.tile p{font-size:11px;color:var(--muted);margin:0 0 13px;line-height:1.5}.tile .big{font-size:22px;font-weight:650;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar .search{flex:1;min-width:160px}.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.pill{padding:7px 11px;border-radius:20px;background:var(--panel2);color:var(--muted);font-size:10px}.pill.active{background:var(--soft);color:var(--accent2)}
.appcards{grid-template-columns:repeat(3,minmax(0,1fr))}.appcard{display:flex;align-items:flex-start;gap:12px}.appicon{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}.appcard h4{font-size:12px;margin:1px 0 5px}.appcard p{font-size:10px;color:var(--muted);margin:0 0 9px;line-height:1.45}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field label{font-size:10px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px;font-size:12px}.field.full{grid-column:1/-1}
.modalback{position:fixed;inset:0;background:rgba(10,15,10,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.25);animation:rise .2s ease}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h3{font-size:16px;margin:0}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--panel);padding:12px 16px;border-radius:12px;font-size:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:40}.toast.show{opacity:1;transform:translateY(0)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.footerhint{margin:16px 3px 0;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:1100px){.nav{max-width:58%}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.mainrow,.lower{grid-template-columns:1fr}.pagegrid,.appcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.app{padding:10px}.shell{grid-template-columns:1fr;gap:10px}.rail{position:sticky;top:5px;z-index:10;min-height:0;height:auto;flex-direction:row;justify-content:flex-start;overflow:auto;padding:7px;border-radius:16px}.logo{width:30px;height:30px;margin:0 7px 0 2px;flex-shrink:0}.railbtn{width:36px;height:36px;flex-shrink:0}.railspacer{display:none}.topbar{padding:10px;border-radius:16px;flex-wrap:wrap}.brandline{min-width:0}.nav{order:3;max-width:100%;width:100%;justify-content:flex-start}.topactions{margin-left:auto}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h1{font-size:22px}.kpis{gap:9px}.card{padding:13px;border-radius:16px}.value{font-size:23px}.pagegrid,.appcards{grid-template-columns:1fr}.chartwrap{height:205px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
<style>[data-page="riders"],[data-page="branches"],[data-page="users"]{display:none!important}#gate{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}#gate form{background:#fff;color:#111;padding:20px;border-radius:12px;display:grid;gap:8px;min-width:260px}#gate .err{color:#c00;margin:0}</style></head>

if(type==='sale'){title='Record branch sale';body=`<div class="formgrid">${field('fAmount','Sales amount','number')}${field('fOrders','Order count','number')}<div class="field full"><label>Branch</label><select id="fBranch">${db.branches.map(b=>`<option>${b.name}</option>`).join('')}</select></div></div><button class="btn accent" id="saveSale" style="margin-top:14px">Save sale</button>`;saveFn=()=>{let amount=Number($('#fAmount').value),orders=Number($('#fOrders').value);if(amount<=0||orders<0)return toast('Enter a valid amount.');db.sales.unshift({branch:$('#fBranch').value,amount,orders,date:today()});save();closeModal();render();toast('Sale recorded.')}}
showModal(title,body,saveFn)}
function editBranch(id){let b=db.branches.find(x=>x.id===id);showModal('Edit branch',`<div class="formgrid">${field('fName','Branch name','text',b.name)}${field('fLocation','Location','text',b.location)}</div><button class="btn accent" id="saveBranch" style="margin-top:14px">Save changes</button>`,()=>{if(!$('#fName').value.trim())return toast('Branch name is required.');b.name=$('#fName').value.trim();b.location=$('#fLocation').value;save();closeModal();render();toast('Branch updated.')})}
function toggleBranch(id){let b=db.branches.find(x=>x.id===id);b.active=!b.active;save();render();toast('Branch status changed.')}
function adjustStock(i){let s=db.stock[i];showModal('Adjust stock',`<div class="formgrid">${field('fQty','New quantity','number',s.qty)}${field('fMin','Minimum quantity','number',s.min)}</div><button class="btn accent" id="saveStock" style="margin-top:14px">Save adjustment</button>`,()=>{s.qty=Math.max(0,Number($('#fQty').value));s.min=Math.max(0,Number($('#fMin').value));save();closeModal();render();toast('Stock adjusted.')})}
function toggleMenu(i){db.menu[i].available=!db.menu[i].available;save();render();toast('Menu availability updated.')}
function toggleRider(i){db.riders[i].status=db.riders[i].status==='On duty'?'Offline':'On duty';save();render();toast('Rider status updated.')}
function toggleUser(i){db.users[i].status=db.users[i].status==='Active'?'Inactive':'Active';save();render();toast('User access status changed.')}
function exportCSV(type){let rows=db[type]||[];if(!rows.length)return toast('No data to export.');let keys=[...new Set(rows.flatMap(Object.keys))],csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hussaini-bites-'+type+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared.')}
function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='hussaini-bites-dashboard-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded.')}
function resetData(){if(!confirm('Reset all local demo changes to the original sample data?'))return;db=JSON.parse(JSON.stringify(defaults));save();render();toast('Demo data reset.')}
window.addEventListener('resize',()=>{if(currentPage==='overview')drawChart()});

/* --- connection layer: sign-in gate and live pages --- */
(async function gate(){
  const g=document.getElementById('gate');
  const me=await HB.staff();
  if(me && ['owner','manager'].includes(me.role)){ g.style.display='none'; return; }
  if(me){ await HB.signOut(); }
  document.getElementById('gateForm').onsubmit=async e=>{
    e.preventDefault(); const f=e.target; const u=f.u.value.trim();
    const email=u.includes('@')?u:u.toLowerCase()+'@staff.hb.local';
    try{
      await HB.signIn(email,f.p.value);
      const who=await HB.staff();
      if(!who||!['owner','manager'].includes(who.role)){ await HB.signOut(); throw Error('Only owner or manager can open the dashboard'); }
      g.style.display='none'; render();
    }catch(err){ document.getElementById('gateErr').textContent=err.message; }
  };
})();
const __render=render;
render=function(){
  const LIVE={
    expenses:['Expenses','Stock purchases and running costs, by month',()=>HBExpenses.mount()],
    staff:['Staff','Cashier and rider logins',()=>HBStaff.mount()],
    sales:['Sales','Takeaway, delivery, counter and app sales for Darman',()=>HBSales.mount()],
  };
  if(LIVE[currentPage]){
    const [t,sub,mount]=LIVE[currentPage];
    $('#view').innerHTML=pageHead(t,sub)+`<div id="${currentPage}" class="card"></div>`;
    mount();
    return;
  }
  __render();
};
render();
</script>
